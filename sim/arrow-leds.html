<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arrow Sign — Function Simulator</title>
  <style>
    :root {
      --bg: #1a1c1e;
      --panel: #242628;
      --ink: #e8e6e1;
      --muted: #9a9690;
      --body: #8a8e94;
      --led-off: #2a2c2e;
      --accent: #8fad6e;
      --warn: #c4a35a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #2a3036 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--panel);
      border-bottom: 1px solid #33363a;
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: 0.02em; }
    .meta { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      padding: 12px 20px;
      background: #1e2124;
      border-bottom: 1px solid #33363a;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .group-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-right: 4px;
    }
    button, .dip {
      appearance: none;
      border: 1px solid #44484d;
      background: #2c2f33;
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 4px;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover, .dip:hover { border-color: #6a7078; }
    button.active {
      background: #3d4a38;
      border-color: var(--accent);
      color: #e8f0d8;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .dip.on {
      background: #3a3428;
      border-color: var(--warn);
      color: #f0e6c8;
    }
    .status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
    }
    .status strong { color: var(--ink); font-weight: 600; }
    main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      place-items: center;
      padding: 16px 16px 32px;
      overflow: auto;
    }
    @media (min-width: 960px) {
      main {
        grid-template-columns: minmax(0, 560px) minmax(260px, 360px);
        align-items: start;
        justify-content: center;
      }
    }
    .stage-wrap, .sign-wrap {
      width: 100%;
      max-width: 560px;
    }
    .sign-wrap { max-width: 360px; }
    .caption {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .caption span { color: var(--ink); }
    svg.arrow {
      width: 100%;
      height: auto;
      display: block;
    }
    .sign-board {
      background: linear-gradient(160deg, #2c3034, #222528);
      border: 1px solid #3a3e44;
      border-radius: 6px;
      padding: 16px 14px 18px;
    }
    .sign-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 0 12px;
    }
    .sign-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
    }
    .sign-led {
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--led-off);
      border: 1px solid #1a1c1e;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
    }
    .pin-hint {
      margin-top: 14px;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Arrow Sign</h1>
      <div class="meta">Firmware function simulator · Nano · LED1–3 · DIP1 / DIP4</div>
    </div>
    <div class="status" id="status">—</div>
  </header>

  <div class="toolbar">
    <div class="controls">
      <span class="group-label">Pattern</span>
      <span id="patternButtons" class="controls"></span>
    </div>
    <div class="controls">
      <span class="group-label">DIP</span>
      <button type="button" class="dip" id="dip1" title="A0 — 50% brightness">1 · 50%</button>
      <button type="button" class="dip" id="dip4" title="A3 — disable Broken Sign">4 · no broken</button>
    </div>
    <div class="controls">
      <span class="group-label">Cycle</span>
      <button type="button" id="autoCycle" class="active">Auto 60s</button>
    </div>
  </div>

  <main>
    <div class="stage-wrap">
      <p class="caption"><span>LED1</span> short D2 · 24 &nbsp;|&nbsp; <span>LED2</span> long D3 · 35</p>
      <svg class="arrow" id="stage" viewBox="0 0 640 860" role="img" aria-label="Arrow CAD outline">
        <path id="body" fill="var(--body)" />
        <g id="leds"></g>
      </svg>
    </div>
    <div class="sign-wrap">
      <p class="caption"><span>LED3</span> sign D4 · 40</p>
      <div class="sign-board">
        <p class="sign-title">Sign strip</p>
        <div class="sign-grid" id="signGrid" aria-label="40 LED sign strip"></div>
        <p class="pin-hint">
          Solid warm white on patterns 1–4.<br />
          Random whole-strip on/off flicker on Broken Sign.<br />
          DIP1 dims everything to 50%. DIP4 skips pattern 5.
        </p>
      </div>
    </div>
  </main>

  <script src="outline-data.js"></script>
  <script>
    const DATA = window.ARROW_OUTLINE;
    const SHORT_N = DATA.short.length;
    const LONG_N = DATA.long.length;
    const SIGN_N = 40;
    const PATTERN_MS = 60000;
    const BOOT_PATTERN = 1;

    const PATTERNS = [
      { id: 1, name: "Chase Fast", boot: true },
      { id: 2, name: "Chase Half" },
      { id: 3, name: "Chase Fine" },
      { id: 4, name: "Twinkle" },
      { id: 5, name: "Broken Sign" },
    ];

    document.getElementById("stage").setAttribute("viewBox", DATA.viewBox.join(" "));
    document.getElementById("body").setAttribute("d", DATA.path_d);

    const arrowLeds = [
      ...DATA.short.map((p, i) => ({ strip: "short", index: i, x: p.x, y: p.y })),
      ...DATA.long.map((p, i) => ({ strip: "long", index: i, x: p.x, y: p.y })),
    ];

    const g = document.getElementById("leds");
    const arrowCircles = arrowLeds.map((led) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", led.x);
      c.setAttribute("cy", led.y);
      c.setAttribute("r", 7);
      c.setAttribute("stroke", "#1a1c1e");
      c.setAttribute("stroke-width", "1.3");
      c.setAttribute("fill", "var(--led-off)");
      g.appendChild(c);
      return c;
    });

    const signGrid = document.getElementById("signGrid");
    const signCells = Array.from({ length: SIGN_N }, (_, i) => {
      const d = document.createElement("div");
      d.className = "sign-led";
      d.title = `LED3[${i}]`;
      signGrid.appendChild(d);
      return d;
    });

    let pattern = BOOT_PATTERN;
    let startMs = performance.now();
    let patternStartedMs = performance.now();
    let autoCycle = true;
    let dip1 = false; // 50% brightness
    let dip4 = false; // disable broken

    // Broken-sign state (short + long)
    const fault = arrowLeds.map(() => ({
      on: true, chronic: false, next: 0, level: 0.55,
    }));
    const shortIdx = arrowLeds.map((l, i) => (l.strip === "short" ? i : -1)).filter((i) => i >= 0);
    const longIdx = arrowLeds.map((l, i) => (l.strip === "long" ? i : -1)).filter((i) => i >= 0);
    for (const pool of [shortIdx, longIdx]) {
      const picks = new Set();
      while (picks.size < 2) picks.add(pool[Math.floor(Math.random() * pool.length)]);
      for (const i of picks) fault[i].chronic = true;
    }
    const deadGroups = [
      { start: 10, count: 5, strip: "long", dead: false, next: 0 },
      { start: 22, count: 6, strip: "long", dead: false, next: 0 },
      { start: 5, count: 4, strip: "short", dead: false, next: 0 },
    ];

    // LED3 whole-strip flicker (Broken Sign only)
    let signOn = true;
    let signNextMs = 0;

    function patternAllowed(id) {
      if (id === 5 && dip4) return false;
      return id >= 1 && id <= 5;
    }

    function nextAllowed(from) {
      let c = from;
      for (let i = 0; i < 5; i++) {
        c = (c % 5) + 1;
        if (patternAllowed(c)) return c;
      }
      return 1;
    }

    function resetBrokenState(now) {
      fault.forEach((f) => {
        f.on = f.chronic ? Math.random() > 0.5 : true;
        f.next = now + 200 + Math.random() * 2000;
        f.level = 0.45 + Math.random() * 0.4;
      });
      deadGroups.forEach((dg) => {
        dg.dead = false;
        dg.next = now + 2000 + Math.random() * 4000;
      });
      signOn = true;
      signNextMs = now + 200 + Math.random() * 600;
    }

    function setPattern(id, now = performance.now()) {
      if (!patternAllowed(id)) id = nextAllowed(id);
      pattern = id;
      startMs = now;
      patternStartedMs = now;
      resetBrokenState(now);
      syncButtons();
      updateStatus(now);
    }

    const btnBox = document.getElementById("patternButtons");
    PATTERNS.forEach((p) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = p.boot ? `${p.id} ${p.name} ★` : `${p.id} ${p.name}`;
      b.dataset.id = String(p.id);
      b.addEventListener("click", () => setPattern(p.id));
      btnBox.appendChild(b);
    });

    function syncButtons() {
      [...btnBox.children].forEach((b) => {
        const id = Number(b.dataset.id);
        b.disabled = !patternAllowed(id);
        b.classList.toggle("active", id === pattern);
      });
    }

    const dip1Btn = document.getElementById("dip1");
    const dip4Btn = document.getElementById("dip4");
    const autoBtn = document.getElementById("autoCycle");

    dip1Btn.addEventListener("click", () => {
      dip1 = !dip1;
      dip1Btn.classList.toggle("on", dip1);
      updateStatus(performance.now());
    });
    dip4Btn.addEventListener("click", () => {
      dip4 = !dip4;
      dip4Btn.classList.toggle("on", dip4);
      if (!patternAllowed(pattern)) setPattern(nextAllowed(pattern));
      else syncButtons();
      updateStatus(performance.now());
    });
    autoBtn.addEventListener("click", () => {
      autoCycle = !autoCycle;
      autoBtn.classList.toggle("active", autoCycle);
      if (autoCycle) patternStartedMs = performance.now();
      updateStatus(performance.now());
    });

    function updateStatus(now) {
      const bri = dip1 ? "50%" : "100%";
      const left = autoCycle
        ? Math.max(0, Math.ceil((PATTERN_MS - (now - patternStartedMs)) / 1000))
        : "—";
      const name = PATTERNS.find((p) => p.id === pattern)?.name ?? "?";
      document.getElementById("status").innerHTML =
        `Pattern <strong>${pattern} ${name}</strong> · brightness <strong>${bri}</strong>` +
        (autoCycle ? ` · next in <strong>${left}s</strong>` : " · auto off");
    }

    function warm(level, scale) {
      const l = Math.max(0, Math.min(1, level)) * scale;
      if (l < 0.02) return "#2a2c2e";
      return `rgb(${Math.round(255 * l)},${Math.round(210 * l)},${Math.round(60 * l)})`;
    }

    function wrap01(p) {
      p = p % 1;
      return p < 0 ? p + 1 : p;
    }

    function pToHead(p, syncA, syncB, last) {
      p = wrap01(p);
      const PA = syncA / Math.max(1, SHORT_N - 1);
      const PB = syncB / Math.max(1, SHORT_N - 1);
      if (p >= 1) return last;
      if (p <= PA) return (p / PA) * syncA;
      if (p <= PB) return syncA + ((p - PA) / (PB - PA)) * (syncB - syncA);
      if (last <= syncB) return syncB;
      return syncB + ((p - PB) / (1 - PB)) * (last - syncB);
    }

    function chaseLevels(now, syncBMs, groups, headLeds) {
      const PB = 8 / Math.max(1, SHORT_N - 1);
      const cycle = syncBMs / PB;
      const t = ((now - startMs) % cycle) / Math.max(1, cycle - 1);
      const levels = {
        short: new Array(SHORT_N).fill(0),
        long: new Array(LONG_N).fill(0),
      };

      function paint(arr, last, syncA, syncB, mirror) {
        for (let g = 0; g < groups; g++) {
          const gp = wrap01(t + g / groups);
          let head = pToHead(gp, syncA, syncB, last);
          if (head > last) head = last;
          for (let i = 0; i <= last; i++) {
            const behind = head - i;
            const v = behind >= 0 && behind < headLeds ? 1 - behind / headLeds : 0;
            if (v > arr[i]) arr[i] = v;
          }
        }
        if (mirror && last >= 23 && arr[22] > 0.05) arr[23] = arr[22];
      }

      paint(levels.short, SHORT_N - 1, 6, 8, true);
      paint(levels.long, LONG_N - 1, 10, 19, false);
      return levels;
    }

    function signFlickerDuration(turningOn) {
      if (turningOn) {
        const roll = Math.random() * 100;
        if (roll < 60) return 400 + Math.random() * 1400;
        if (roll < 90) return 1800 + Math.random() * 2700;
        return 80 + Math.random() * 320;
      }
      const roll = Math.random() * 100;
      if (roll < 65) return 40 + Math.random() * 140;
      if (roll < 90) return 180 + Math.random() * 320;
      return 500 + Math.random() * 700;
    }

    function tick(now) {
      if (autoCycle && now - patternStartedMs >= PATTERN_MS) {
        setPattern(nextAllowed(pattern), now);
      }
      if (!patternAllowed(pattern)) {
        setPattern(nextAllowed(pattern), now);
      }

      const scale = dip1 ? 0.5 : 1;
      const levels = {
        short: new Array(SHORT_N).fill(0),
        long: new Array(LONG_N).fill(0),
      };
      let signLevel = 1; // solid warm white by default

      if (pattern === 1) Object.assign(levels, chaseLevels(now, 667, 3, 2));
      else if (pattern === 2) Object.assign(levels, chaseLevels(now, 1334, 3, 2));
      else if (pattern === 3) Object.assign(levels, chaseLevels(now, 889, 10, 1));
      else if (pattern === 4) {
        for (let i = 0; i < SHORT_N; i++) {
          levels.short[i] = 0.28 + 0.18 * Math.sin(now / 180 + i * 1.7) + Math.random() * 0.06;
        }
        for (let i = 0; i < LONG_N; i++) {
          levels.long[i] = 0.28 + 0.18 * Math.sin(now / 200 + i * 1.3) + Math.random() * 0.06;
        }
      } else {
        for (const dg of deadGroups) {
          if (now >= dg.next) {
            dg.dead = !dg.dead;
            dg.next = now + (dg.dead ? 1500 + Math.random() * 7000 : 3000 + Math.random() * 8000);
          }
        }
        arrowLeds.forEach((led, i) => {
          const f = fault[i];
          if (now >= f.next) {
            f.on = !f.on;
            if (f.on) f.level = f.chronic ? 0.25 + Math.random() * 0.5 : 0.4 + Math.random() * 0.35;
            f.next = now + (f.chronic
              ? (f.on ? 200 + Math.random() * 500 : 150 + Math.random() * 350)
              : (f.on ? 2000 + Math.random() * 10000 : 40 + Math.random() * 500));
          }
          let dead = false;
          for (const dg of deadGroups) {
            if (dg.dead && dg.strip === led.strip &&
                led.index >= dg.start && led.index < dg.start + dg.count) {
              dead = true;
            }
          }
          const v = !f.on || dead ? 0 : f.level;
          if (led.strip === "short") levels.short[led.index] = v;
          else levels.long[led.index] = v;
        });

        while (now >= signNextMs) {
          signOn = !signOn;
          signNextMs = now + signFlickerDuration(signOn);
        }
        signLevel = signOn ? 1 : 0;
      }

      arrowCircles.forEach((c, i) => {
        const led = arrowLeds[i];
        const v = led.strip === "short" ? levels.short[led.index] : levels.long[led.index];
        c.setAttribute("fill", warm(v, scale));
      });
      signCells.forEach((cell) => {
        cell.style.background = warm(signLevel, scale);
      });

      if (Math.floor(now / 250) !== Math.floor((now - 16) / 250)) updateStatus(now);
      requestAnimationFrame(tick);
    }

    syncButtons();
    updateStatus(performance.now());
    requestAnimationFrame(tick);
  </script>
</body>
</html>
