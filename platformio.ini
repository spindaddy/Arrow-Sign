; Arduino Nano (ATmega328P) — Arrow Sign controller
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.12.0

; Boards with the newer Optiboot bootloader:
; board = nanoatmega328new

; Uncomment and set if auto-detect picks the wrong port:
; upload_port = /dev/cu.usbserial*
; monitor_port = /dev/cu.usbserial*
